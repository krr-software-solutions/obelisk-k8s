
repo:
  name: "repo-1"
  helmRepos:
    ex1: https://abc.com/helm
  configPaths:
    - "./config/.global/values.yaml"
    - "./config/.global/${{obelisk:target}}.values.yaml"
    - "./config/${{obelisk:unit}}/values.yaml"
    - "./config/${{obelisk:unit}}/${{obelisk:target}}.values.yaml"
  generators:
    - type: "gotmpl"
      path: "./config/.global/generate-values.yaml.gotmpl"
    - type: "gotmpl"
      path: "./config/.global/${{obelisk:target}}.generate-values.yaml.gotmpl"
    - type: "gotmpl"
      path: "./config/${{obelisk:unit}}/generate-values.yaml.gotmpl"
    - type: "gotmpl"
      path: "./config/${{obelisk:unit}}/${{obelisk:target}}.generate-values.yaml.gotmpl"
