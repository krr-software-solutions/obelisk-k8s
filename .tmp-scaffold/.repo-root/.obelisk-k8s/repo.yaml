
repo:
  name: "repo-1"
  helmRepos:
    ex1: https://abc.com/helm
  configPaths: # all `configPaths` in all places are `String[]`, must start with `./`, and resolve from the repos `.obelisk-k8s/` dir
    - "./config/.global/values.yaml"
    - "./config/.global/${{obelisk:target}}.values.yaml"
    - "./config/${{obelisk:unit}}/values.yaml"
    - "./config/${{obelisk:unit}}/${{obelisk:target}}.values.yaml"

# TODO (KR) : what is the right order for `configPaths` to merge between `repo.yaml`, `targets/*.yaml`, and `units/*.yaml`?
#           : Initial thought would be that itd be really nice to be able to detect the `${{obelisk:...}}` in each path,
#           : and use those to bucket.
#           : so, high level priority (lowest->highest) is:
#           : - repo
#           : - target
#           : - unit
#           : - target+unit
#           : then, granular priority would be (lowest->highest): (rough guess, if this seems sensible)
#           : - `repo.yaml` (no interpolation)
#           : - `repo.yaml` (interpolates `target`)
#           : - `targets/*/target.yaml` (no interpolation)
#           : - `repo.yaml` (interpolates `unit`)
#           : - `units/*/unit.yaml` (no interpolation)
#           : - `repo.yaml` (interpolates `target+unit`)
#           : - `targets/*/target.yaml` (interpolates `unit`)
#           : - `units/*/unit.yaml` (interpolates `target`)
