# obelisk-k8s CI: the pre-merge checks on MRs.
#
# An MR runs:
#   test     check-pre-merge       no fix-before-merge markers left behind
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

include:
  - project: 'krrss/util/pipeline-utils'
    ref: main
    file: '/util.yaml'

stages:
  - test

# ----- test -----

check-pre-merge:
  extends:
    - .runner
    - ".mr=auto,tag=never"
  stage: test
  image: alpine:3.21
  before_script:
    - apk add --no-cache bash git
  script:
    - bash scripts/check-for-fix.sh
