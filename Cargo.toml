[workspace]
resolver = "3"
members = [
    "code/obelisk-k8s",
    "code/obelisk-k8s-cli",
]

[workspace.package]
# Placeholder: the real version comes from the git tag. CI runs `scripts/set-version.sh`
# (`v1.2.3` → `1.2.3`) before building, so local builds report 0.0.0. Keep it (and the `=0.0.0`
# pin below) at 0.0.0: the script refuses to run without them.
version = "0.0.0"
edition = "2024"
rust-version = "1.89" # serde-saphyr 2.0 needs 1.89
license = "MIT OR Apache-2.0"
repository = "https://github.com/krr-software-solutions/obelisk-k8s"
homepage = "https://github.com/krr-software-solutions/obelisk-k8s"
readme = "README.md"
keywords = ["kubernetes", "helm", "k3d", "deployment"]

[workspace.dependencies]
# workspace crates: published together, so each pins the others exactly.
obelisk-k8s = { path = "code/obelisk-k8s", version = "=0.0.0" }

anstream = "1"
anstyle = "1"
# SSM parameters for `${{obelisk:aws-ssm:...}}`, with credentials from the AWS_SSM_* variables only.
# AWS_SSM_PROFILE: a named profile (~/.aws/config, credentials; SSO, assume-role, credential_process).
aws-config = "1"
aws-sdk-ssm = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
# Masking resolved SSM values in their base64 form too (a Secret's `data`, `b64enc`).
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
# 2.x moves fast (1.0 → 2.0 in ~2.5 months); stay on 2.0.x until we choose to migrate.
serde-saphyr = "~2.0"
# The generic tree for values files (merging, the `obelisk:` block); YAML stays in serde-saphyr.
serde_json = { version = "1", features = ["preserve_order"] }
# Where in a build plan decoding it failed (`build.phases[0].values[1]`).
serde_path_to_error = "0.1"
# Checking a `type: url` render's download against its `sha256`.
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
# Only to drive the AWS SDK: one current-thread runtime, made with the client and kept for the run.
tokio = { version = "1", features = ["rt"] }
# Lossless YAML edits (comments and formatting kept). Pinned: it's 0.x, with one maintainer, and moves fast.
yaml-edit = "=0.3.6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
